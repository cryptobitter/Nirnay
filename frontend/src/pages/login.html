<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Nirnay</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#000a23",
                        "primary-container": "#12213f",
                        "secondary": "#1c52ce",
                        "background": "#f7f9fe",
                        "on-surface-variant": "#45464e",
                        "surface-container-lowest": "#ffffff"
                    }
                }
            }
        }
    </script>
<link href="../../assets/css/animations.css" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-[#F4F6FB] min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-background relative">
<canvas id="bg-canvas"></canvas>

<div class="w-full max-w-[400px] bg-surface-container-lowest border border-[#DDE2EE] rounded-xl shadow-[0px_4px_20px_rgba(18,33,63,0.08)] p-lg flex flex-col gap-lg reveal-scale">
<!-- Header -->
<a href="landing.html" class="text-center flex flex-col gap-sm items-center hover:opacity-90 transition-opacity">
<div class="font-display-lg text-display-lg text-primary-container">Nirnay</div>
<p class="font-body-md text-on-surface-variant">Institutional Decision Auditing Systems</p>
</a>

<!-- Form -->
<form action="pending-verification.html" class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<input class="w-full h-10 px-sm border border-[#DDE2EE] rounded-xl font-body-md text-on-background focus:outline-none focus:border-[#2A5BD7] focus:ring-1 focus:ring-[#2A5BD7] transition-colors" id="email" placeholder="auditor@institution.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-body-md text-[#2A5BD7] hover:underline" href="#">Forgot password?</a>
</div>
<input class="w-full h-10 px-sm border border-[#DDE2EE] rounded-xl font-body-md text-on-background focus:outline-none focus:border-[#2A5BD7] focus:ring-1 focus:ring-[#2A5BD7] transition-colors" id="password" placeholder="••••••••" required="" type="password"/>
</div>
<button class="w-full h-10 bg-[#2A5BD7] hover:bg-[#1C52CE] text-white font-title-lg rounded-xl transition-colors mt-sm flex items-center justify-center gap-xs shadow-sm" type="submit">
                Log In
            </button>
</form>

<!-- Divider -->
<div class="relative flex py-sm items-center">
<div class="flex-grow border-t border-[#DDE2EE]"></div>
<span class="flex-shrink-0 mx-sm font-body-md text-on-surface-variant">or continue with</span>
<div class="flex-grow border-t border-[#DDE2EE]"></div>
</div>

<!-- Google Auth -->
<a href="landing.html" class="w-full h-10 border border-[#DDE2EE] hover:bg-surface-container-low text-on-background font-body-md rounded-xl transition-colors flex items-center justify-center gap-sm">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
<path d="M1 1h22v22H1z" fill="none"></path>
</svg>
            Continue with Google
        </a>

<!-- Footer Link -->
<div class="text-center mt-sm">
<span class="font-body-md text-on-surface-variant">Don't have an account? </span>
<a class="font-body-md text-[#2A5BD7] hover:underline" href="signup.html">Sign up</a>
</div>
</div>
<script src="../../assets/js/animations.js"></script>
</body></html>
